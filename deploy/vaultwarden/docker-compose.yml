# Password vault (Vaultwarden = server for the Bitwarden apps). Reached only over Tailscale:
#   https://s1824923.tailcfd197.ts.net:8443  (see install.sh)
# First start, to create your account:  VW_SIGNUPS=true docker compose up -d
# Then close registration:              docker compose up -d
services:
  vaultwarden:
    image: vaultwarden/server:1.33.2   # ponytail: pinned, bump by hand after reading release notes
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "127.0.0.1:8222:80"
    volumes:
      - vw-data:/data
    environment:
      DOMAIN: https://s1824923.tailcfd197.ts.net:8443
      SIGNUPS_ALLOWED: ${VW_SIGNUPS:-false}
      INVITATIONS_ALLOWED: "false"
      # ADMIN_TOKEN is not set, so the /admin page is disabled
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vw-data:
